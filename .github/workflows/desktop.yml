# Builds the Windows desktop app. Runs on demand (Actions tab -> "Build desktop app" -> Run workflow)
# and on version tags such as v1.1.0, where the zip is also attached to a GitHub Release.
name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run package:win
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Holography Bench-win32-x64" -DestinationPath "Holography-Bench-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Holography-Bench-win-x64
          path: desktop/Holography-Bench-win-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/Holography-Bench-win-x64.zip
